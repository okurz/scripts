[project]
name = "scripts"
version = "0.0.0"
description = "Personal admin, openQA, OBS/gitea, and git helper scripts."
requires-python = "~=3.13.0"
license = "MIT"
authors = [{ name = "Oliver Kurz" }]

dependencies = [
    "httpx",
    "python-dateutil",
    "PyYAML",
    "requests",
    "selenium",
    "typer",
]

[dependency-groups]
dev = [
    "coverage",
    "gitlint",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "responses",
    "ruff",
    "ty",
    "vulture",
]

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "test/*",
    # Local-only files excluded via .git/info/exclude; they are not part of the repo
    "dbcli.py",
    "dropbox.py",
    "freetz_start_service.py",
    "huffman.py",
    "pdfsizeopt.py",
    "pyDropboxPath.py",
    "smsgui.py",
    "smsmngr.py",
    "write_tsocks_conf.py",
]

[tool.coverage.report]
# Ratchet baseline measured on 2026-10-23; plan 001_I raises this to 100
fail_under = 71
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
addopts = "-p no:anyio -p no:doctest -p no:pastebin -p no:nose"
testpaths = ["test"]
python_files = "test_*.py"

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
extend-select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM",
    "D",
    "DTZ",
    "EM",
    "ERA",
    "EXE",
    "FA",
    "FBT",
    "FIX",
    "FLY",
    "G",
    "ICN",
    "INP",
    "INT",
    "I",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RSE",
    "RET",
    "RUF0",
    "RUF100",
    "S",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "TC",
    "TD",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "too-many-public-methods",
    "docstring-missing-returns",
    "docstring-missing-exception",
    # Accepted: ruff drops one of each incompatible pair, we keep the D211/D212 flavour
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "missing-trailing-comma",  # accepted: COM812 fights ruff format
    "N812",          # accepted: selenium docs use the EC alias
    "S404",          # accepted: these scripts shell out to osc, ssh, git by design
    "S603",          # accepted: same as S404
    "S607",          # accepted: same as S404
    "S602",          # accepted: curl|grep|sed pipeline in suse-qa-sle-etherpad-status
    "S314",          # accepted: OBS/IBS metadata is trusted, defusedxml buys nothing
    "S405",          # accepted: same as S314
    "S608",          # accepted: psql -c string in openqa-db_query_last_use_of_module
    "S101",          # 001_F1 (assert in osc-list-all-unresolvables stub)
    "F821",          # 001_F1 (undefined sql_query in the same stub)
    # Ratchet baseline, removed by the plan task named here
    "FIX002",        # 001_B3
    "TD002",         # 001_B3
    "TD003",         # 001_B3
    "TD004",         # 001_B3
    "PLW2901",       # 001_B3
    "ARG001",        # 001_B3
    "ARG005",        # 001_B3
    "C901",          # 001_B4
    "PLR0911",       # 001_B4
    "PLR0912",       # 001_B4
    "PLR0913",       # 001_B4
    "PLR0914",       # 001_B4
    "PLR0915",       # 001_B4
    "PLR0917",       # 001_B4
    "PLW0717",       # 001_B4
]

[tool.ruff.lint.mccabe]
max-complexity = 9

[tool.ruff.lint.per-file-ignores]
"test/*" = [
    "any-type",
    "assert",
    "hardcoded-password-func-arg",
    "hardcoded-password-string",
    "implicit-namespace-package",
    "invalid-rule-code",
    "magic-value-comparison",
    "missing-return-type-undocumented-public-function",
    "missing-type-function-argument",
    "too-many-arguments",
    "too-many-positional-arguments",
    "undocumented-public-function",
    "boolean-type-hint-positional-argument",
]
"gitea-review-cleanup" = ["B008", "FBT001", "FBT002", "FBT003", "S105"]  # S105: token file path, not a secret
"osc-sync-deps" = ["B008"]
"osc-sync-leap" = ["B008", "T201", "FBT001", "FBT002", "FBT003"]
"osc-get-pr-status" = ["FBT001", "FBT003"]
"bluelinktoken.py" = ["T201", "S105"]  # S105: OAuth client credentials published by the car makers
"find_non_utf8.py" = ["T201"]
"mac-to-ipv6" = ["T201"]
"obs-pr-repair" = ["T201"]
"redmine-fetcher" = ["T201"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python = ".venv"
