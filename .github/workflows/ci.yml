name: ci
# yamllint disable-line rule:truthy
on: [push, pull_request]

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get install -y shellcheck
      - run: uv run make checkstyle check-code-health PYTHON_RUN="uv run"

  # continue-on-error until plan 001_D lands: tests/test_osc_list_all_unresolvables.py needs network
  tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run make test-unit-no-coverage ISOLATE=0 PYTHON_RUN="uv run"
